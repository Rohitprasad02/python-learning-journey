
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Expense | Smart Expense Tracker</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <main class="container">
        <header class="page-header">
            <p class="eyebrow">SMART EXPENSE TRACKER</p>
            <h1>Edit Expense</h1>
            <p>Update your expense details below.</p>
        </header>

        <section class="panel">
            <form action="{{ url_for('update_expense', expense_id=expense.id) }}"
                  method="POST">

                <label for="amount">Amount (₹)</label>
                <input
                    type="number"
                    id="amount"
                    name="amount"
                    min="0.01"
                    step="0.01"
                    value="{{ expense.amount }}"
                    required
                >

                <label for="category">Category</label>
                <select id="category" name="category" required>
                    {% for category in ["Food", "Travel", "Shopping", "Bills", "Other"] %}
                        <option value="{{ category }}"
                            {% if expense.category == category %}selected{% endif %}>
                            {{ category }}
                        </option>
                    {% endfor %}
                </select>

                <label for="description">Description</label>
                <input
                    type="text"
                    id="description"
                    name="description"
                    maxlength="100"
                    value="{{ expense.description }}"
                    required
                >

                <div class="form-actions">
                    <button type="submit">Save Changes</button>
                    <a class="button button-secondary"
                       href="{{ url_for('home') }}">Cancel</a>
                </div>
            </form>
        </section>
    </main>
</body>
</html>
